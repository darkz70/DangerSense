# # # # # # # # # # # # # #
#    Gradle Properties    #
# # # # # # # # # # # # # #

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Stonecutter
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties (схема ключей "data.*" — как ожидает FigureStonePluginSettings/Core)
data.mod_id = dangersense
data.mod_name = Danger Sense
data.mod_version = 1.0.0
data.mod_group = com.darkz.dangersense
data.mod_maven_group = com.darkz

data.mod_description = Warns the player before dangerous situations become fatal. Warnings only — never blocks damage.
data.mod_authors = darkz70
data.mod_license = CC-BY-ND-4.0
data.sides = client
data.mixin_configs = none

# Main Dependencies
base.lombok_version = 1.18.42

# Multi-Versions Properties (схема "<loader>.multi_versions" — новая, пост-ребрендинг)
mod_loaders = fabric
fabric.multi_versions = 1.20.1 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11

# Build Dependencies
build.fabric_loader = 0.17.2
build.fabric_api = [VERSIONED]

# FigureStoneLib — теперь ОБЯЗАТЕЛЬНАЯ зависимость Danger Sense (не опциональная).
# Через "dep.*" конвенцию плагина (ProcessResourcesManager срезает префикс
# "dep." и кладёт значение в плейсхолдер ${figurestonelib} для fabric.mod.json).
# Публикуется она не на Modrinth, а в вашем приватном GitHub Packages — поэтому
# maven-координаты берём вручную в build.gradle (не через модуль "dep"-резолвинга
# плагина, который заточен под maven.modrinth:<id>:<version>).
dep.figurestonelib = 1.0.0

# # # # # # # # # # # # # #
#  Publication Properties #
# # # # # # # # # # # # # #

versions_specifications = 1.20.1 1.21 1.21.1 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11
version_type = RELEASE
test_publish = false

modrinth_id = ny4uQZc2
curseforge_id = 1625363

curseforge_token = ${System.getenv("CURSEFORGE_API_KEY")}
modrinth_token = ${System.getenv("MODRINTH_API_KEY")}

is_for_client = true
is_for_server = false
max_java_version = 25

depends_requires = fabric-api
depends_optional = none
depends_incompatible = none
depends_embeds = none

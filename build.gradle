// Этот файл общий для root-проекта И каждого версионного подпроекта
// (versions/fabric-<version>) — так работает Stonecutter в hard_mode.
// StonecutterControllerExtension (нужен -stonecutter) существует ТОЛЬКО
// на root-проекте, а не на подпроектах — поэтому применяем плагины по
// условию "это root или нет", а не оба сразу везде (именно так упал CI:
// "Extension of type 'StonecutterControllerExtension' does not exist"
// при попытке применить -stonecutter к :fabric-1.20.1).
plugins {
	id "net.darkz70.figurestone-plugin-core" version "1.2.0" apply false
	id "net.darkz70.figurestone-plugin-stonecutter" version "1.2.0" apply false
}

if (project == rootProject) {
	// Даёт агрегирующие задачи buildAndCollect+<loader>+All, buildAndCollect+All,
	// publish+All и т.д. — именно buildAndCollect+All вызывается в вашем
	// реальном build.yml SkinTotem.
	apply plugin: "net.darkz70.figurestone-plugin-stonecutter"
} else {
	// core-модуль сам применяет fabric-loom, stonecutter (per-project),
	// mod-publish-plugin и настраивает mappings через
	// loom.officialMojangMappings() — Yarn не используется.
	apply plugin: "net.darkz70.figurestone-plugin-core"

	figurestoneDependencies {
		minecraft = stonecutter.current.version.toString()
		fabricApi = prop("build.fabric_api")
		fabricLoader = prop("build.fabric_loader")
		lombok = prop("base.lombok_version")
	}

	// FigureStoneLib — ОБЯЗАТЕЛЬНАЯ зависимость. Подключается напрямую, а не
	// через "dep."-резолвинг плагина (тот заточен под Modrinth-координаты
	// maven.modrinth:<id>:<version>, а FigureStoneLib — в приватном GitHub Packages).
	repositories {
		maven {
			name "DarkZ70GitHubPackages"
			url "https://maven.pkg.github.com/darkz70/FigureStoneLib"
			credentials {
				username = System.getenv("GH_PACKAGES_USERNAME")
				password = System.getenv("GH_PACKAGES_TOKEN")
			}
		}
	}

	dependencies {
		// modImplementation (не compileOnly/implementation) — библиотека нужна
		// и на этапе компиляции, и на рантайме, и должна быть remap'нута Loom'ом.
		modImplementation "com.darkz:figurestonelib:${prop("dep.figurestonelib")}"
	}
}

String prop(String key) {
	return findProperty(key)?.toString() ?: ""
}
